name: Demo PR Gate

on:
  pull_request:
    branches:
      - demo/test-pr-gate-base

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: write

jobs:
  unit-tests-and-boilerplate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Verify boilerplate headers
        uses: ./.github/actions/verify-boilerplate
        with:
          base-ref: master

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run PR gate unit tests
        run: |
          python3 -m pip install -r hack/pr-gate/requirements.txt
          PYTHONPATH=hack/pr-gate python3 -m unittest discover -s hack/pr-gate -p "*_test.py" -v

  pr-gate:
    uses: uberstoic/testing/.github/workflows/pr-gate.yaml@feat/reusable-pr-gate
    with:
      testing-repository: uberstoic/testing
      testing-ref: feat/reusable-pr-gate
      approve-workflows: false
