name: Demo Publish Image

on:
  push:
    branches:
      - demo/test-publish-image

permissions:
  contents: read

jobs:
  test-publish-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Verify boilerplate headers
        uses: ./.github/actions/verify-boilerplate
        with:
          base-ref: master

      - name: Test multi-arch build with publish-image action
        uses: ./.github/actions/publish-image
        with:
          image: ghcr.io/uberstoic/testing/demo-image
          dockerfile: hack/demo-image/Dockerfile
          context: hack/demo-image
          platforms: linux/amd64,linux/arm64
          push: "false"
          version: v0.1.0-test
